<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:Arial,sans-serif;background:#0e0f11;color:#e8eaf0;display:flex;flex-direction:column;}

/* LOGIN */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e0f11;z-index:9999;}
.lbox{background:#16181d;border:1px solid #2a2d35;border-radius:10px;padding:40px;text-align:center;width:320px;}
.lbox h1{color:#c8f135;font-size:20px;margin-bottom:8px;}
.lbox p{color:#6b7280;font-size:14px;margin-bottom:20px;}
.lbox input{width:100%;padding:10px;background:#0e0f11;border:1px solid #2a2d35;border-radius:6px;color:#e8eaf0;font-size:14px;margin-bottom:10px;outline:none;}
.lbox input:focus{border-color:#c8f135;}
#lerr{color:#ef4444;font-size:12px;margin-top:6px;display:none;}

/* TOPBAR */
#topbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#16181d;border-bottom:1px solid #2a2d35;flex-shrink:0;}
.topbar-left{display:flex;align-items:center;gap:12px;}
#topbar h2{color:#c8f135;font-size:15px;margin:0;}
.fav-toggle{background:transparent;border:1px solid #2a2d35;border-radius:6px;color:#9ca3af;font-size:12px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:4px;}
.fav-toggle.active{border-color:#f59e0b;color:#f59e0b;}

/* BUTTONS */
.btn{background:#c8f135;color:#0e0f11;border:none;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px;width:100%;}
.btn:hover{opacity:0.88;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.sec{background:transparent!important;color:#c8f135!important;border:1px solid #c8f135!important;width:auto!important;padding:7px 14px!important;}

/* MAIN LAYOUT */
#wrap{display:flex;flex:1;height:calc(100vh - 44px);}
#sidebar{width:370px;min-width:370px;flex-shrink:0;background:#16181d;border-right:1px solid #2a2d35;display:flex;flex-direction:column;overflow:hidden;}

/* INPUT AREA */
#inp{padding:12px;border-bottom:1px solid #2a2d35;flex-shrink:0;}
#inp label{font-size:10px;color:#6b7280;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px;}
textarea{width:100%;height:80px;background:#0e0f11;border:1px solid #2a2d35;border-radius:6px;color:#e8eaf0;font-size:12px;padding:8px;resize:none;outline:none;line-height:1.5;font-family:Arial,sans-serif;}
textarea:focus{border-color:#c8f135;}
#runbtn{margin-top:8px;}

/* FILTER/SORT BAR */
#filterbar{padding:8px 10px;border-bottom:1px solid #2a2d35;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.filter-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.filter-label{font-size:10px;color:#6b7280;white-space:nowrap;margin-right:2px;}
.pill{font-size:10px;padding:3px 8px;border-radius:20px;border:1px solid #2a2d35;background:transparent;color:#9ca3af;cursor:pointer;white-space:nowrap;}
.pill:hover{border-color:#555;color:#e8eaf0;}
.pill.active{background:#c8f135;color:#0e0f11;border-color:#c8f135;font-weight:700;}
.sort-select{font-size:11px;background:#0e0f11;border:1px solid #2a2d35;color:#9ca3af;border-radius:4px;padding:3px 6px;cursor:pointer;outline:none;}
.sort-select:focus{border-color:#c8f135;}

/* STATUS/ERROR */
#sb{padding:6px 12px;font-size:12px;color:#9ca3af;border-bottom:1px solid #2a2d35;display:none;flex-shrink:0;}
#eb{padding:6px 12px;font-size:12px;color:#fca5a5;background:#450a0a;border-bottom:1px solid #7f1d1d;display:none;flex-shrink:0;}

/* CARDS */
#cards{flex:1;overflow-y:auto;padding:8px;}
.emp{color:#6b7280;font-size:13px;text-align:center;padding:20px 8px;line-height:1.6;}
.card{background:#111827;border:1px solid #2a2d35;border-radius:8px;padding:11px;margin-bottom:7px;cursor:pointer;transition:border-color 0.1s;position:relative;}
.card:hover{border-color:#555;}
.card.sel{border-color:#c8f135;}
.card.is-fav{border-color:#f59e0b44;}
.card-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:2px;}
.ca{font-size:12px;font-weight:700;flex:1;line-height:1.3;}
.bdg{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;white-space:nowrap;flex-shrink:0;}

/* DEAL SCORE BADGE */
.deal-badge{position:absolute;top:10px;right:40px;font-size:10px;padding:3px 8px;border-radius:4px;font-weight:700;white-space:nowrap;}
.deal-excellent{background:#14532d;color:#86efac;border:1px solid #166534;}
.deal-good{background:#713f12;color:#fde68a;border:1px solid #a16207;}
.deal-fair{background:#1e3a8a;color:#93c5fd;border:1px solid #1e40af;}
.deal-poor{background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d;}

/* STAR BUTTON */
.star-btn{position:absolute;top:10px;right:10px;background:none;border:none;cursor:pointer;font-size:16px;line-height:1;padding:0;color:#4b5563;}
.star-btn.starred{color:#f59e0b;}
.star-btn:hover{transform:scale(1.2);}

.st{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px;}
.s{font-size:10px;color:#6b7280;line-height:1.4;}
.s strong{display:block;font-size:12px;color:#e8eaf0;}
.pb{border-radius:5px;padding:7px 9px;font-size:11px;line-height:1.5;margin-bottom:7px;}
.ph{background:#1c1500;border:1px solid #713f12;color:#fde68a;}
.po{background:#0a1a0f;border:1px solid #166534;color:#86efac;}
.pn{background:#111827;border:1px solid #374151;color:#9ca3af;}

/* PROFIT BOX */
.profit-box{background:#0f172a;border:1px solid #1e3a8a;border-radius:5px;padding:8px;margin-bottom:7px;}
.profit-title{font-size:10px;color:#60a5fa;margin-bottom:4px;font-weight:700;}
.profit-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;}
.profit-label{color:#6b7280;}
.profit-value{color:#e8eaf0;font-weight:600;}
.profit-total{font-size:12px;font-weight:700;color:#86efac;margin-top:4px;padding-top:4px;border-top:1px solid #1e3a8a;}

/* PLAN DOCS */
.plan-docs{margin-bottom:7px;}
.plan-name{font-size:10px;color:#9ca3af;margin-bottom:4px;}
.doc-links{display:flex;gap:4px;flex-wrap:wrap;}
.doc-btn{font-size:10px;padding:3px 8px;border-radius:4px;background:#1e2433;border:1px solid #374151;color:#60a5fa;cursor:pointer;text-decoration:none;display:inline-block;}
.doc-btn:hover{background:#253047;border-color:#60a5fa;}

.ml{font-size:11px;color:#60a5fa;text-decoration:none;display:block;margin-bottom:5px;}
.ml:hover{text-decoration:underline;}
.mr{display:flex;align-items:center;gap:5px;padding-top:7px;border-top:1px solid #2a2d35;flex-wrap:wrap;}
.mr label{font-size:10px;color:#6b7280;white-space:nowrap;}
.mr input{width:72px;padding:3px 7px;background:#0e0f11;border:1px solid #2a2d35;border-radius:4px;color:#e8eaf0;font-size:11px;outline:none;}
.mr input:focus{border-color:#c8f135;}
.mb{padding:3px 10px;font-size:11px;background:#c8f135;color:#0e0f11;border:none;border-radius:4px;cursor:pointer;font-weight:700;}

/* LEGEND */
#leg{padding:8px 12px;border-top:1px solid #2a2d35;display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0;}
.lg{display:flex;align-items:center;gap:4px;font-size:10px;color:#6b7280;}
.ld{width:9px;height:9px;border-radius:50%;}

/* MAP */
#map{flex:1;background:#1a1a2e;}
.leaflet-popup-content-wrapper{background:#16181d!important;color:#e8eaf0!important;border:1px solid #2a2d35!important;border-radius:8px!important;font-family:Arial,sans-serif!important;box-shadow:0 8px 32px rgba(0,0,0,.5)!important;}
.leaflet-popup-tip{background:#16181d!important;}
.pt{font-size:13px;font-weight:700;display:block;margin-bottom:6px;color:#c8f135;}
.pr{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;gap:12px;}
.pl{color:#6b7280;}

/* STAR MARKER */
.star-marker{font-size:24px;line-height:1;text-align:center;color:#f59e0b;text-shadow:0 0 3px rgba(0,0,0,0.8),-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;}
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map=null, mLayer=null, favLayer=null;
var allE=[], ov={}, mkC={}, geoC={}, ngpMin={}, ngpPlan={}, ngpDocs={}, ngpAssets={};
var favs={};
var showFavOnly=false;
var currentFilter='alla';
var CLR={green:'#39ff14',orange:'#ffae00',red:'#ff2d2d',grey:'#555555'};
var FAV_CLR='#f59e0b';

console.log('=== LandSplit Analytics Pro v4 + Kommun Detection ===');

/* ══════════════════════════════════════════════════════════════════════════
   KOMMUN DETECTION - Added for multi-municipality support
   ══════════════════════════════════════════════════════════════════════════ */
var STOCKHOLM_KOMMUNER = {
  'botkyrka': {name: 'Botkyrka kommun', code: '0127'}, 
  'danderyd': {name: 'Danderyds kommun', code: '0162'}, 
  'ekerö': {name: 'Ekerö kommun', code: '0125'},
  'haninge': {name: 'Haninge kommun', code: '0136'}, 
  'huddinge': {name: 'Huddinge kommun', code: '0126'}, 
  'järfälla': {name: 'Järfälla kommun', code: '0123'},
  'lidingö': {name: 'Lidingö kommun', code: '0186'}, 
  'nacka': {name: 'Nacka kommun', code: '0182'}, 
  'norrtälje': {name: 'Norrtälje kommun', code: '0188'},
  'nykvarn': {name: 'Nykvarns kommun', code: '0140'}, 
  'nynäshamn': {name: 'Nynäshamns kommun', code: '0192'}, 
  'salem': {name: 'Salems kommun', code: '0128'},
  'sigtuna': {name: 'Sigtuna kommun', code: '0191'}, 
  'sollentuna': {name: 'Sollentuna kommun', code: '0163'}, 
  'solna': {name: 'Solna kommun', code: '0184'},
  'stockholm': {name: 'Stockholms kommun', code: '0180'}, 
  'sundbyberg': {name: 'Sundbybergs kommun', code: '0183'}, 
  'södertälje': {name: 'Södertälje kommun', code: '0181'}, 
  'tyresö': {name: 'Tyresö kommun', code: '0138'}, 
  'täby': {name: 'Täby kommun', code: '0160'},
  'upplands-bro': {name: 'Upplands-Bro kommun', code: '0139'}, 
  'upplands väsby': {name: 'Upplands Väsby kommun', code: '0114'},
  'upplands-väsby': {name: 'Upplands Väsby kommun', code: '0114'}, 
  'vallentuna': {name: 'Vallentuna kommun', code: '0115'},
  'vaxholm': {name: 'Vaxholms kommun', code: '0187'}, 
  'värmdö': {name: 'Värmdö kommun', code: '0120'}, 
  'österåker': {name: 'Österåkers kommun', code: '0117'}
};

function detectKommunFromText(text) {
  if (!text) return 'Värmdö kommun';
  var normalized = text.toLowerCase().replace(/\s+/g, ' ').trim();
  
  for (var key in STOCKHOLM_KOMMUNER) {
    var kommun = STOCKHOLM_KOMMUNER[key];
    var kommunName = kommun.name;
    
    if (normalized.indexOf(kommunName.toLowerCase()) !== -1) {
      console.log('[KOMMUN] Found exact match:', kommunName);
      return kommunName;
    }
    var baseNameWithoutKommun = kommunName.replace(' kommun', '').toLowerCase();
    if (normalized.indexOf(baseNameWithoutKommun) !== -1) {
      console.log('[KOMMUN] Found match (base name):', kommunName);
      return kommunName;
    }
    if (normalized.indexOf(key) !== -1) {
      console.log('[KOMMUN] Found match (key):', kommunName);
      return kommunName;
    }
  }
  
  console.log('[KOMMUN] No match found, using default: Värmdö kommun');
  return 'Värmdö kommun';
}

function getKommunCode(kommunName) {
  // Convert kommun name to code
  var normalized = kommunName.toLowerCase().replace(' kommun', '').trim();
  
  for (var key in STOCKHOLM_KOMMUNER) {
    var kommun = STOCKHOLM_KOMMUNER[key];
    if (kommun.name.toLowerCase() === kommunName.toLowerCase() || 
        kommun.name.toLowerCase().replace(' kommun', '') === normalized ||
        key === normalized) {
      return kommun.code;
    }
  }
  
  return '0120'; // Default to Värmdö
}

function detectKommunFromCoordinates(lat, lon, callback) {
  var url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&zoom=10&addressdetails=1';
  
  fetch(url, { headers: {'User-Agent': 'LandSplit/1.0'} })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    console.log('[KOMMUN] Nominatim response:', data);
    
    if (data && data.address) {
      var municipality = data.address.municipality || data.address.town || data.address.city || data.address.county;
      
      if (municipality) {
        console.log('[KOMMUN] Found municipality:', municipality);
        var detected = detectKommunFromText(municipality);
        callback(detected);
        return;
      }
    }
    
    console.log('[KOMMUN] Could not detect from coordinates, using default');
    callback('Värmdö kommun');
  })
  .catch(function(err) {
    console.log('[KOMMUN] Geocoding error:', err);
    callback('Värmdö kommun');
  });
}


/* ── PRICE BASELINES ── */
var MB={
  'täby':{b:6500,n:'Täby'},'nacka':{b:8500,n:'Nacka'},'lidingö':{b:9000,n:'Lidingö'},
  'solna':{b:7500,n:'Solna'},'stockholm':{b:9500,n:'Stockholm'},'danderyd':{b:9000,n:'Danderyd'},
  'sundbyberg':{b:7000,n:'Sundbyberg'},'järfälla':{b:5500,n:'Järfälla'},'huddinge':{b:5000,n:'Huddinge'},
  'haninge':{b:4000,n:'Haninge'},'tyresö':{b:5500,n:'Tyresö'},'värmdö':{b:5000,n:'Värmdö'},
  'ekerö':{b:5000,n:'Ekerö'},'österåker':{b:4500,n:'Österåker'},'vaxholm':{b:6000,n:'Vaxholm'},
  'norrtälje':{b:3500,n:'Norrtälje'},'sigtuna':{b:3500,n:'Sigtuna'},
  'upplands-bro':{b:3000,n:'Upplands-Bro'},'södertälje':{b:3000,n:'Södertälje'},
  'nynäshamn':{b:3000,n:'Nynäshamn'}
};
function getMuni(a){var l=a.toLowerCase();for(var k in MB){if(l.indexOf(k)!==-1)return MB[k];}return{b:6000,n:'Stockholmsregionen'};}
function fmt(p){if(!p)return'–';return p>=1e6?(p/1e6).toFixed(2).replace('.',',')+' mnkr':Number(p).toLocaleString('sv-SE')+' kr';}
function ppm(e){return e.price&&e.plotSize?Math.round(e.price/e.plotSize):null;}

/* ── FAVOURITES ── */
function loadFavs(){try{var s=localStorage.getItem('ls_favs');if(s)favs=JSON.parse(s);}catch(e){favs={};}}
function saveFavs(){try{localStorage.setItem('ls_favs',JSON.stringify(favs));}catch(e){}}
function isFav(addr){return !!favs[addr];}
function toggleFav(ev,btn){
  ev.stopPropagation();
  var addr=btn.getAttribute('data-addr');
  if(favs[addr])delete favs[addr]; else favs[addr]=true;
  saveFavs();
  btn.textContent=isFav(addr)?'⭐':'☆';
  btn.style.color=isFav(addr)?'#f59e0b':'#4b5563';
  var card=btn.closest?btn.closest('.card'):btn.parentElement.parentElement.parentElement;
  if(card){if(isFav(addr))card.classList.add('is-fav');else card.classList.remove('is-fav');}
  updateFavMarkers();
}
function toggleFavView(){
  showFavOnly=!showFavOnly;
  var btn=document.getElementById('fav-toggle');
  btn.className='fav-toggle'+(showFavOnly?' active':'');
  renderCards();
}

function updateFavMarkers(){
  if(!favLayer)return;
  favLayer.clearLayers();
  for(var addr in favs){
    if(!favs[addr])continue;
    var geo=geoC[addr];
    if(!geo)continue;
    var inCurrent=false;
    for(var i=0;i<allE.length;i++){if(allE[i].address===addr){inCurrent=true;break;}}
    if(!inCurrent){
      var icon=L.divIcon({
        className:'',
        html:'<div class="star-marker">⭐</div>',
        iconSize:[24,24],
        iconAnchor:[12,24]
      });
      var mk=L.marker([geo.lat,geo.lon],{icon:icon}).addTo(favLayer);
      mk.bindPopup('<span class="pt">⭐ '+addr+'</span><div class="pr"><span class="pl">Favorit</span></div>',{maxWidth:200});
    }

/* ── PROFIT CALCULATOR ── */
function calculateDealMetrics(e, minSize, muniBaseline) {
  if(!e.price || !e.plotSize || !minSize) return null;
  
  var splitPotential = Math.floor(e.plotSize / minSize);
  if(splitPotential < 2) return null;
  
  var marketPricePerM2 = muniBaseline || 6000;
  var totalValueIfSplit = splitPotential * minSize * marketPricePerM2;
  
  var profitPotential = totalValueIfSplit - e.price;
  var profitPercent = (profitPotential / e.price) * 100;
  
  var dealScore = 0;
  if(profitPercent > 50) dealScore = 100;
  else if(profitPercent > 30) dealScore = 80;
  else if(profitPercent > 15) dealScore = 60;
  else if(profitPercent > 5) dealScore = 40;
  else if(profitPercent > 0) dealScore = 20;
  
  if(splitPotential >= 3) dealScore = Math.min(100, dealScore + 15);
  if(splitPotential >= 4) dealScore = Math.min(100, dealScore + 10);
  
  var currentPricePerM2 = e.price / e.plotSize;
  if(currentPricePerM2 > marketPricePerM2 * 1.2) dealScore = Math.max(0, dealScore - 20);
  
  return {
    splitPotential: splitPotential,
    totalValueIfSplit: totalValueIfSplit,
    profitPotential: profitPotential,
    profitPercent: profitPercent,
    dealScore: dealScore,
    dealRating: dealScore >= 80 ? 'excellent' : dealScore >= 60 ? 'good' : dealScore >= 40 ? 'fair' : 'poor'
  };
}

  if(s==='deal-score') list.sort(function(a,b){return getDealScore(b)-getDealScore(a);});

    });

}

/* WGS84 -> SWEREF99 TM - Based on Lantmäteriet's official implementation */
function wgs84ToSweref(lat, lon) {
  // SWEREF99 TM parameters
  var axis = 6378137.0;
  var flattening = 1.0/298.257222101;
  var central_meridian = 15.0;
  var scale = 0.9996;
  var false_northing = 0.0;
  var false_easting = 500000.0;

  var e2 = flattening * (2.0 - flattening);
  var n = flattening / (2.0 - flattening);
  var a_roof = axis / (1.0 + n) * (1.0 + n*n/4.0 + n*n*n*n/64.0);

  var phi = lat * Math.PI / 180.0;
  var lambda = lon * Math.PI / 180.0;
  var lambda0 = central_meridian * Math.PI / 180.0;

  var phi_star = phi - Math.sin(phi) * Math.cos(phi) * 
    (e2 + e2*e2 + e2*e2*e2 + e2*e2*e2*e2 + e2*e2*e2*e2*e2);
  
  var delta_lambda = lambda - lambda0;
  var xi_prim = Math.atan(Math.tan(phi_star) / Math.cos(delta_lambda));
  var eta_prim = Math.atanh(Math.cos(phi_star) * Math.sin(delta_lambda));

  var beta1 = 1.0/2.0*n - 2.0/3.0*n*n + 5.0/16.0*n*n*n + 41.0/180.0*n*n*n*n;
  var beta2 = 13.0/48.0*n*n - 3.0/5.0*n*n*n + 557.0/1440.0*n*n*n*n;
  var beta3 = 61.0/240.0*n*n*n - 103.0/140.0*n*n*n*n;
  var beta4 = 49561.0/161280.0*n*n*n*n;

  var xi = xi_prim +
    beta1 * Math.sin(2.0*xi_prim) * Math.cosh(2.0*eta_prim) +
    beta2 * Math.sin(4.0*xi_prim) * Math.cosh(4.0*eta_prim) +
    beta3 * Math.sin(6.0*xi_prim) * Math.cosh(6.0*eta_prim) +
    beta4 * Math.sin(8.0*xi_prim) * Math.cosh(8.0*eta_prim);

  var eta = eta_prim +
    beta1 * Math.cos(2.0*xi_prim) * Math.sinh(2.0*eta_prim) +
    beta2 * Math.cos(4.0*xi_prim) * Math.sinh(4.0*eta_prim) +
    beta3 * Math.cos(6.0*xi_prim) * Math.sinh(6.0*eta_prim) +
    beta4 * Math.cos(8.0*xi_prim) * Math.sinh(8.0*eta_prim);

  var x = scale * a_roof * xi + false_northing;
  var y = scale * a_roof * eta + false_easting;

  return {E: Math.round(y), N: Math.round(x)};
}

function pointInRing(px, py, ring) {
  if (!ring || ring.length < 3) return false;
  var inside = false;
  for (var i=0, j=ring.length-1; i<ring.length; j=i++) {
    var xi=ring[i][0], yi=ring[i][1];
    var xj=ring[j][0], yj=ring[j][1];
    var intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}
function pointInGeometry(px, py, geom) {
  if (!geom) return false;
  if (geom.type==='Polygon') return pointInRing(px, py, geom.coordinates[0]);
  if (geom.type==='MultiPolygon') return geom.coordinates.some(function(p){return pointInRing(px,py,p[0]);});
  return false;
}

  .then(function(r){

            if(l.roles.includes('planbeskrivning')||l.roles.includes('planhandling')||
               l.roles.includes('document')||l.roles.includes('illustration')){
              console.log('[NGP] ★ Found document role:', l.roles, '→', l.href);
              if(l.href&&l.type==='application/pdf'){
                result.docs.push({title:l.title||'Dokument',href:l.href});
                console.log('[NGP] ✓ Added document from roles:', l.title);
              }
            }
          }
          
          // Also check for direct PDF links
          if(l.href&&(l.type==='application/pdf'||l.href.toLowerCase().indexOf('.pdf')!==-1)){
            result.docs.push({title:l.title||'Dokument',href:l.href});
            console.log('[NGP] ✓ Added PDF document:', l.title);
          }
        });
        
        // Collect asset URLs to fetch
        if(f.assets){
          console.log('[NGP] Found assets:', JSON.stringify(f.assets).substring(0,200));
          for(var assetKey in f.assets){
            var asset=f.assets[assetKey];
            if(asset.href){
              // Try to extract a better title from the asset
              var assetTitle=asset.title||'Detaljplan';
              // Clean up the title if it's cut off
              if(assetTitle==='Detaljpla')assetTitle='Detaljplan';
              allLinks.push({type:'asset',href:asset.href,title:assetTitle});
            }
          }
        }
      });
      
      console.log('[NGP] Total links found:', allLinks.length, 'PDF documents found:', result.docs.length);
      
      // Store asset links for lazy loading (don't fetch yet)
      var assetLinks=allLinks.filter(function(l){return l.type==='asset';});
      console.log('[NGP] Asset links to store for lazy loading:', assetLinks.length);
      
      // Deduplicate asset links by href
      var seenHrefs={};
      var uniqueAssets=[];
      assetLinks.forEach(function(link){
        if(!seenHrefs[link.href]){
          seenHrefs[link.href]=true;
          uniqueAssets.push(link);
        }
      });
      console.log('[NGP] Unique asset links after dedup:', uniqueAssets.length);
      
      // Store assets for lazy loading
      result.assetLinks=uniqueAssets;
      console.log('[NGP] ⚡ Skipping asset fetch - will load on demand');
      
      finishWithResult();
      
      function finishWithResult(){
        console.log('[NGP] Final result - Plan:', result.planNamn, 'MinSize:', result.minSize, 'Docs:', result.docs.length);
        
        // Continue with the rest of the processing
        console.log('[NGP] Processing', pbFeatures.length, 'bestämmelse features...');
      var checkedCount=0, foundTomtCount=0;
      var allTomtRules=[]; // Store all tomt rules with distances
      var foundMatch=false; // Early exit flag
      
      pbFeatures.forEach(function(f){
        if(foundMatch)return; // Early exit if we found a match
        
        var pid=(f.properties||{}).planidentitet||null;
        if(pid&&!validPlanIds[pid])return;
        
        // Check BOTH planbestämmelse and egenskapsbestämmelse
        var pb=(f.properties||{}).planbestammelse||(f.properties||{}).egenskapsbestammelse||{};
        var bestType=(f.properties||{}).planbestammelse?'planbestämmelse':'egenskapsbestämmelse';
        
        var formulering=pb.bestammelseformulering||'';
        var fl=formulering.toLowerCase();
        var isMinTomt=fl.indexOf('tomtplats')!==-1||fl.indexOf('tomtstorlek')!==-1||
          fl.indexOf('fastighetsstorlek')!==-1||fl.indexOf('minsta tomt')!==-1||
          fl.indexOf('minsta fastighet')!==-1||fl.indexOf('tomtens areal')!==-1||
          fl.indexOf('fastighetens areal')!==-1||fl.indexOf('minsta area')!==-1||
          fl.indexOf('tomtens storlek')!==-1;
        
        if(!isMinTomt)return;
        
        foundTomtCount++;
        console.log('[NGP] Found tomt '+bestType+' #'+foundTomtCount+':', formulering.substring(0,100));
        
        // Try to extract the size value
        var extractedSize=null;
        var varde=pb.bestammelsevarde;
        console.log('[NGP] bestammelsevarde:', JSON.stringify(varde));
        
        if(varde){
          var v=null;
          if(varde.variabelvarde!=null){
            v=parseFloat(varde.variabelvarde);
            console.log('[NGP] Found variabelvarde:', v);
          } else if(Array.isArray(varde)&&varde.length>0&&varde[0].variabelvarde!=null){
            v=parseFloat(varde[0].variabelvarde);
            console.log('[NGP] Found variabelvarde in array[0]:', v);
          }
          
          if(v!=null&&!isNaN(v)){
            var enhet=(varde.enhet||'');
            if(Array.isArray(varde)&&varde.length>0){
              enhet=varde[0].enhet||'';
            }
            console.log('[NGP] Checking unit:', enhet, 'for value:', v);
            
            var okEnhet=enhet.indexOf('meter')!==-1||enhet.indexOf('m2')!==-1||enhet.indexOf('m²')!==-1||enhet==='';
            if(okEnhet&&v>=50&&v<=20000){
              extractedSize=v;
              console.log('[NGP] Extracted from variabelvarde:', v, 'with unit:', enhet);
            } else {
              console.log('[NGP] Rejected variabelvarde - okEnhet:', okEnhet, 'value range ok:', (v>=50&&v<=20000));
            }
          }
        }
        
        if(!extractedSize){
          var ex=extractSizeFromText(formulering);
          if(ex){
            extractedSize=ex;
            console.log('[NGP] Extracted from text:', ex);
          } else {
            console.log('[NGP] Could not extract from text:', formulering);
          }
        }
        
        if(!extractedSize)return;
        
        // Calculate distance from point to this feature's geometry
        var distance=999999;
        var passedPIP=false;
        if(f.geometry&&f.geometry.coordinates&&f.geometry.coordinates.length){
          var ring=f.geometry.coordinates[0];
          passedPIP=pointInGeometry(sw.E,sw.N,f.geometry);
          
          // Calculate minimum distance from point to any vertex of the polygon
          var minDist=Infinity;
          for(var vi=0;vi<ring.length;vi++){
            var dx=ring[vi][0]-sw.E;
            var dy=ring[vi][1]-sw.N;
            var dist=Math.sqrt(dx*dx+dy*dy);
            if(dist<minDist)minDist=dist;
          }
          distance=minDist;
          console.log('[NGP] '+bestType+' with size '+extractedSize+': PIP='+(passedPIP?'PASS':'FAIL')+', distance='+Math.round(distance)+'m');
        } else {
          console.log('[NGP] '+bestType+' with size '+extractedSize+': no geometry');
        }
        
        allTomtRules.push({
          size:extractedSize,
          distance:distance,
          passedPIP:passedPIP,
          bestType:bestType,
          formulering:formulering
        });
        
        // Early exit if we found a rule that passes PIP
        if(passedPIP){
          foundMatch=true;
          console.log('[NGP] ⚡ Early exit - found PIP match with size:', extractedSize);
        }
      });
      
      console.log('[NGP] Found', allTomtRules.length, 'tomt rules total');
      
      // Sort by: PIP passed first, then by distance
      allTomtRules.sort(function(a,b){
        if(a.passedPIP&&!b.passedPIP)return -1;
        if(!a.passedPIP&&b.passedPIP)return 1;
        return a.distance-b.distance;
      });
      
      // Log all rules found
      allTomtRules.forEach(function(rule,idx){
        console.log('[NGP] Rule #'+(idx+1)+': size='+rule.size+'m², PIP='+(rule.passedPIP?'PASS':'FAIL')+', dist='+Math.round(rule.distance)+'m, type='+rule.bestType);
      });
      
      // Pick the best one
      if(allTomtRules.length>0){
        result.minSize=allTomtRules[0].size;
        console.log('[NGP] ✓✓✓ Selected minSize='+result.minSize+' (PIP='+(allTomtRules[0].passedPIP?'PASS':'FAIL')+', distance='+Math.round(allTomtRules[0].distance)+'m)');
      }
      
      console.log('[NGP] Bestämmelse summary: checked='+checkedCount+', found tomt rules='+foundTomtCount+', extracted minSize='+result.minSize);

      console.log('[NGP] === FINAL RESULT: plan='+result.planNamn+', minSize='+result.minSize+', docs='+result.docs.length);
      cb(result);
      } // end continueWithResult
    }
  });
}

function extractSizeFromText(text){
  var t=(text||'').toLowerCase();
  console.log('[EXTRACT] Attempting to extract from text:', t);
  
  var patterns=[
    /(\d{3,6})\s*(?:kvadratmeter|kvm|m[\u00b22])/i,
    /areal[^0-9]*(\d{3,6})/i,
    /(?:minst|lägst|minsta|största)[^0-9]*(\d{3,6})/i,
    /\bf\s+(\d{3,5})\b/i,
    /storlek[^0-9]*(\d{3,6})/i,
    /(\d{3,6})\s*m2/i,
    /(\d{3,6})\s*kvadrat/i,
    /(\d[\s]?\d{3})\s*(?:kvadratmeter|kvm|m[\u00b22]|m2)/i  // Handle space in thousands
  ];
  
  for(var i=0;i<patterns.length;i++){
    var m=t.match(patterns[i]);
    if(m){
      var rawVal=m[1].replace(/\s/g,'');  // Remove spaces
      var v=parseInt(rawVal);
      console.log('[EXTRACT] Pattern', i, 'matched:', m[0], '=> value:', v);
      if(v>=50&&v<=20000){
        console.log('[EXTRACT] ✓ Accepted value:', v);
        return v;
      } else {
        console.log('[EXTRACT] ✗ Rejected value (out of range):', v);
      }
    }
  }
  console.log('[EXTRACT] No patterns matched');
  return null;
}

function lookupNGPForAll(entries, done){
  console.log('[NGP] Starting batch lookup for', entries.length, 'entries');
  var sb=document.getElementById('sb');
  sb.style.display='block';
  var total=entries.length, completed=0;
  var active=0, idx=0, CONCURRENCY=5;
  
  var overallTimeout=setTimeout(function(){
    console.log('[NGP] OVERALL TIMEOUT - forcing completion');
    sb.style.display='none';
    done();
  }, 60000);

  function updateStatus(){
    sb.textContent='Söker detaljplan '+completed+'/'+total+'...';
  }

  function finishOne(e, data){
    try{
      var result=data||{};
      if(result.minSize&&!ov[e.address])ngpMin[e.address]=result.minSize;
      if(result.planNamn)ngpPlan[e.address]=result.planNamn+(result.beteckning?' ('+result.beteckning+')':'');
      if(result.docs&&result.docs.length)ngpDocs[e.address]=result.docs;
      if(result.assetLinks&&result.assetLinks.length)ngpAssets[e.address]=result.assetLinks;
      var geo2=geoC[e.address];
      var old=document.querySelector('.card[data-addr="'+e.address.replace(/"/g,'\\"')+'"]');
      if(old)old.parentNode.replaceChild(buildCard(e,geo2,!geo2),old);
      var mk=mkC[e.address];
      if(mk){
        var mn=ov[e.address]||ngpMin[e.address]||null;
        var a=assess(e.plotSize,mn,e.address);
        if(isFav(e.address)){
          var icon=L.divIcon({
            className:'',
            html:'<div class="star-marker">⭐</div>',
            iconSize:[24,24],
            iconAnchor:[12,24]
          });
          mk.setIcon(icon);
        } else {
          mk.setStyle({fillColor:CLR[a.c],color:'#000',weight:1.5,fillOpacity:1});
        }
        mk.setPopupContent(mkPopup(e,mn));
      }
    }catch(err){console.log('[NGP] finishOne error:',err.message);}
    active--;completed++;updateStatus();
    if(idx<entries.length)processOne();
    else if(active===0){
      clearTimeout(overallTimeout);
      console.log('[NGP] Batch lookup complete:', completed, '/', total);
      done();
    }
  }

  function processOne(){
    console.log('[NGP] processOne called, idx:', idx, 'entries.length:', entries.length);
    if(idx>=entries.length){
      console.log('[NGP] processOne: idx >= entries.length, returning');
      if(active===0&&completed>=total){
        clearTimeout(overallTimeout);
        done();
      }
      return;
    }
    var e=entries[idx++];
    console.log('[NGP] processOne: processing', e.address);
    console.log('[NGP] processOne: checking geo for', e.address);
    var geo=geoC[e.address];
    if(!geo){
      console.log('[NGP] Skipping (no geo):', e.address);
      completed++;updateStatus();
      if(idx<entries.length)processOne();
      else if(active===0&&completed>=total){
        clearTimeout(overallTimeout);
        done();
      }
      return;
    }
    console.log('[NGP] processOne: checking muni code for', e.address);
    if(!getMuniCode(e.address)){
      console.log('[NGP] Skipping (no muni code):', e.address);
      completed++;updateStatus();
      if(idx<entries.length)processOne();
      else if(active===0&&completed>=total){
        clearTimeout(overallTimeout);
        done();
      }
      return;
    }
    console.log('[NGP] processOne: starting search for', e.address);
    active++;
    var timedOut=false;
    var tout=setTimeout(function(){
      timedOut=true;
      console.log('[NGP] TIMEOUT (10s):', e.address);
      finishOne(e,null);
    },10000);
    searchNGP(geo.lat,geo.lon,e.address,function(data){
      if(timedOut)return;
      clearTimeout(tout);
      finishOne(e,data);
    });
  }

  updateStatus();
  var startN=Math.min(CONCURRENCY,entries.length);
  for(var i=0;i<startN;i++)processOne();
  if(entries.length===0){
    clearTimeout(overallTimeout);
    done();
  }
}

/* ── ASSESS ── */
function assess(sz,mn,addr){
  if(!sz)return{c:'grey',label:'Tomt saknas',tc:'#9ca3af',bg:'#1f2937',min:null,src:'none'};
  if(!mn)return{c:'grey',label:'Saknar plandata',tc:'#9ca3af',bg:'#1f2937',min:null,src:'none'};
  var src=ov[addr]?'manual':ngpMin[addr]?'ngp':'none';
  if(sz>=mn*2)return{c:'green',label:'Troligen delbar',tc:'#86efac',bg:'#14532d',min:mn,src:src};
  if(sz>=mn*1.5)return{c:'orange',label:'Gränsfall',tc:'#fcd34d',bg:'#451a03',min:mn,src:src};
  return{c:'red',label:'Inte delbar',tc:'#fca5a5',bg:'#450a0a',min:mn,src:src};
}

/* ── PRICE BOX ── */
function priceBox(e,mn){
  if(!e.price||!e.plotSize)return'';
  var mu=getMuni(e.address),p=Math.round(e.price/e.plotSize);
  var pct=Math.round((p/mu.b-1)*100),sign=pct>=0?'+':'';
  var div=mn&&e.plotSize>=mn*2,brd=mn&&!div&&e.plotSize>=mn*1.5;
  var info='<b>'+p.toLocaleString('sv-SE')+' kr/m²</b> tomt ('+sign+pct+'% vs median '+mu.n+': '+mu.b.toLocaleString('sv-SE')+' kr/m²)';
  if(!mn)return'<div class="pb pn">'+info+'. Ange min. tomtstorlek för prisanalys.</div>';
  if(div&&pct>20)return'<div class="pb ph">⚠ Delbar men priset verkar inkludera delningstillägg (+'+Math.abs(pct)+'%). Räkna bort 10–25%.</div>';
  if(div)return'<div class="pb po">✓ Delbar och priset verkar rimligt. '+info+'.</div>';
  if(brd)return'<div class="pb pn">~ Gränsfall. '+info+'.</div>';
  return'<div class="pb" style="background:#111;border:1px solid #333;color:#6b7280;">Ej delbar — delningstillägg ej relevant. '+info+'.</div>';
}

function profitBox(e,mn){
  if(!mn||!e.price||!e.plotSize)return'';
  var mu=getMuni(e.address);
  var metrics=calculateDealMetrics(e,mn,mu.b);
  if(!metrics)return'';
  
  var html='<div class="profit-box">';
  html+='<div class="profit-title">💰 VINSTPOTENTIAL</div>';
  html+='<div class="profit-row"><span class="profit-label">Antal tomter:</span><span class="profit-value">'+metrics.splitPotential+' st</span></div>';
  html+='<div class="profit-row"><span class="profit-label">Värde efter delning:</span><span class="profit-value">'+fmt(metrics.totalValueIfSplit)+'</span></div>';
  html+='<div class="profit-row"><span class="profit-label">Nuvarande pris:</span><span class="profit-value">'+fmt(e.price)+'</span></div>';
  html+='<div class="profit-total">Potential: '+fmt(metrics.profitPotential)+' ('+metrics.profitPercent.toFixed(0)+'%)</div>';
  html+='</div>';
  return html;
}

/* CRITICAL FIX: Better address parsing to keep municipality */
function parseText(raw){
  if(/^https?:\/\/.*hemnet\.se.*$/i.test(raw.trim())){
    showErr('Hemnet-länk: kopiera och klistra in texten från sidan istället.');
    return [];
  }

  var rawLines=raw.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var filtered=[], inSold=false;

  function isUIJunk(ln){
    return /^(hoppa till|sök bostad|sök mäklare|sälja bostad|nyheter|bygga hus|min bostad|logga in|bevaka sökning|kartval|karta i fullskärm|sortera på|nyast först|så sorteras|kommande \d|till salu \d|slutpriser \d|bevaka den här|återvänder du|spara din sökning|artiklar från|bild för artikel|sponsrad av|nyproduktion|prenumerera|mäklaretipset|mäklartipset|profilfoto|plus$|premium|balkong|uteplats)/i.test(ln)
      || /^broker-tip/i.test(ln)
      || /^\d+ av \d+$/.test(ln)
      || /^\d+ dagar?$/i.test(ln)
      || /^(mån|tis|ons|tor|fre|lör|sön)\b.*kl \d/i.test(ln);
  }

  for(var fi=0;fi<rawLines.length;fi++){
    var fl=rawLines[fi];
    if(isUIJunk(fl))continue;
    if(/^såld/i.test(fl)||/^slutpris:/i.test(fl)||/^sålt av oss/i.test(fl)||/kontakta oss om/i.test(fl)||/^lokala mäklare/i.test(fl)){
      inSold=true; continue;
    }
    if(inSold){
      if(/^(mån|tis|ons|tor|fre|lör|sön)\b/i.test(fl)||/- bild \d/i.test(fl)||/^\d+ dagar?$/i.test(fl)||/^(idag|igår)$/i.test(fl)||/^\d+ rum (villa|fritidshus|tomt|stuga)/i.test(fl)){
        inSold=false;
        continue;
      }
      continue;
    }
    filtered.push(fl);
  }

  var entries=[], lines=filtered;
  var reA=/^([A-ZÅÄÖ][a-zåäöA-ZÅÄÖ \-]{1,60})\s+(\d{1,4}[A-Za-z]?)\s*$/;
  var reP=/(\d[\d\s]*(?:[,.]\d+)?)\s*(mnkr|miljoner|mkr|kr)\b/i;
  /* CRITICAL FIX: Only match tomt size with "tomt" keyword */
  var reT1=/(\d[\d\s]+)\s*m[²2]\s+tomt\b/i;
  var reT2=/tomt[a-zåäö]*\s*[:\s]\s*(\d[\d\s]*)\s*m[²2]/i;
  var reT3=/(\d[\d\s,]+)\s+(?:m[²2]\s+)?tomt\b/i;
  var addr=null,city=null,price=null,plot=null;

  function flush(){
    if(addr){
      var fullAddr=addr;
      if(city)fullAddr+=', '+city;
      entries.push({address:fullAddr,price:price,plotSize:plot});
      console.log('[PARSE] Parsed entry:', fullAddr, 'price:', price, 'plot:', plot);
    }
    addr=null;city=null;price=null;plot=null;
  }

  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    
    var mA=ln.match(reA);
    if(mA){
      flush();
      addr=mA[1].trim()+' '+mA[2];
      city=null;price=null;plot=null;
      continue;
    }
    
    if(/^(Täby|Nacka|Lidingö|Solna|Stockholm|Danderyd|Sundbyberg|Järfälla|Huddinge|Haninge|Tyresö|Värmdö|Ekerö|Österåker|Vaxholm|Norrtälje|Sigtuna|Upplands-Bro|Södertälje|Nynäshamn|Sollentuna|Vallentuna|Upplands-Väsby|Nykvarn|Botkyrka|Salem|Ingarö|Gustavsberg|Bodatorp|Fågelvik)\b/i.test(ln)){
      if(!city)city=ln.trim();
      continue;
    }
    
    if(/kommun/.test(ln)){
      var parts=ln.split(/[,\s]+/);
      for(var pi=0;pi<parts.length;pi++){
        if(/^(Värmdö|Täby|Nacka|Stockholm|Solna)/.test(parts[pi])){
          if(!city||city.indexOf('kommun')===-1)city=parts[pi];
        }
      }
      continue;
    }
    
    var mP=ln.match(reP);
    if(mP&&!price){
      var n=parseFloat(mP[1].replace(/\s/g,'').replace(',','.'));
      var u=mP[2].toLowerCase();
      if(u==='mnkr'||u==='miljoner')n*=1e6;
      else if(u==='mkr')n*=1000;
      price=Math.round(n);
      continue;
    }
    
    /* CRITICAL FIX: ONLY capture if line contains "tomt" keyword */
    if(!plot){
      var mT=ln.match(reT1)||ln.match(reT2)||ln.match(reT3);
      if(mT){
        var v=parseInt(mT[1].replace(/[\s,]/g,''));
        if(v>=100&&v<=50000){
          plot=v;
          console.log('[PARSE] Found tomt:', plot, 'from line:', ln);
        }
      }
    }
  }
  flush();

  var seen={}, out=[];
  entries.forEach(function(e){
    var key=e.address.toLowerCase().split(',')[0].trim();
    var existing=seen[key];
    if(!existing){seen[key]=e;out.push(e);}
    else if((e.price||e.plotSize)&&(!existing.price&&!existing.plotSize)){
      var idx=out.indexOf(existing);
      if(idx>=0)out[idx]=e;
      seen[key]=e;
    }
  });

  console.log('[PARSE] Final parsed entries:', out);
  return out;
}

function cleanAddr(addr){
  var p=addr.split(',').map(function(s){return s.trim();});
  if(p.length>=3)return p[0]+', '+p[p.length-1].replace(/\s*kommun\s*/i,'').trim();
  return addr.replace(/\s*kommun\s*/i,'').trim();
}

/* CRITICAL FIX: Better geocoding with full address including municipality */
function nominatimOne(addr,cb){
  console.log('[GEO] Nominatim geocoding:', addr);
  var q=encodeURIComponent(addr+', Sverige');
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=se&q='+q)
  .then(function(r){return r.ok?r.json():[];})
  .then(function(d){
    if(d&&d[0]){
      console.log('[GEO] Nominatim result:', d[0].display_name, d[0].lat, d[0].lon);
      cb({lat:parseFloat(d[0].lat),lon:parseFloat(d[0].lon)});
    } else{
      console.log('[GEO] Nominatim found nothing for:', addr);
      cb(null);
    }
  })
  .catch(function(err){console.log('[GEO] Nominatim error:', err);cb(null);});
}
function nominatimAll(entries,coords,idx,done){
  if(idx>=entries.length){done(coords);return;}
  var sb=document.getElementById('sb');
  if(sb)sb.textContent='Geocoding '+(idx+1)+'/'+entries.length+': '+entries[idx].address+'...';
  nominatimOne(entries[idx].address,function(geo){
    if(geo)coords[entries[idx].address]=geo;
    setTimeout(function(){nominatimAll(entries,coords,idx+1,done);},800);
  });
}

function geocodeAll(entries,done){
  console.log('[GEO] Starting Nominatim geocoding for', entries.length, 'addresses');
  nominatimAll(entries,{},0,done);
}

/* ── LAZY LOAD PDFs ── */
function loadAndShowPDFs(btn){
  var addr=btn.getAttribute('data-addr');
  var planNamn=btn.getAttribute('data-plan');
  
  if(!ngpAssets[addr]||!ngpAssets[addr].length){
    console.log('[LAZY] No assets for:', addr);
    return;
  }
  
  // Show loading state
  btn.textContent='⏳ Laddar...';
  btn.disabled=true;
  
  var assetLinks=ngpAssets[addr];
  var docs=[];
  var fetchedCount=0;
  
  console.log('[LAZY] Fetching', assetLinks.length, 'assets for:', addr);
  
  getNGPToken(function(token){
    if(!token){
      btn.textContent='❌ Fel';
      return;
    }
    
    assetLinks.forEach(function(assetLink){
      fetchNGP(assetLink.href, token, function(assetData){
        fetchedCount++;
        
        if(assetData){
          if(assetData.isPDF){
            var title=assetLink.title||'Plankarta';
            if(title==='Detaljplan'||title==='Asset'){
              var url=assetData.url.toLowerCase();
              if(url.indexOf('planbeskrivning')!==-1)title='Planbeskrivning';
              else if(url.indexOf('plankarta')!==-1)title='Plankarta';
              else if(url.indexOf('illustration')!==-1)title='Illustration';
              else title='Planhandling';
            }
            docs.push({title:title,href:assetData.url});
          } else {
            if(assetData.planhandlingar && Array.isArray(assetData.planhandlingar)){
              assetData.planhandlingar.forEach(function(ph){
                if(ph.fil && ph.fil.length>0){
                  ph.fil.forEach(function(fil){
                    if(fil.lank){
                      var title=fil.namn||ph.handlingstyp||'Dokument';
                      docs.push({title:title,href:fil.lank});
                    }
                  });
                }
              });
            }
          }
        }
        
        // When all fetched, store and open
        if(fetchedCount===assetLinks.length){
          ngpDocs[addr]=docs;
          delete ngpAssets[addr]; // Remove assets, we have docs now
          console.log('[LAZY] Loaded', docs.length, 'documents');
          
          // Rebuild card to show loaded docs
          var e=allE.find(function(entry){return entry.address===addr;});
          if(e){
            var geo2=geoC[addr];
            var old=document.querySelector('.card[data-addr="'+addr.replace(/"/g,'\\"')+'"]');
            if(old)old.parentNode.replaceChild(buildCard(e,geo2,!geo2),old);
          }
          
          // Open PDF panel
          openPDF(planNamn, docs);
        }
      });
    });
  });
}

/* ── WMS DETALJPLAN OVERLAY ── */
var DP_WMS_URL='https://api.lantmateriet.se/distribution/geodatakatalog/visning/v1/detaljplan/v1/wms';
var dpLayer=null, wmsOn=false;

function toggleWMS(){
  var btn=document.getElementById('wms-toggle');
  if(!map)return;
  if(wmsOn){
    if(dpLayer){map.removeLayer(dpLayer);dpLayer=null;}
    wmsOn=false;
    if(btn){btn.style.background='';btn.style.color='';}
    map.off('click',onMapClickWMS);
    return;
  }
  getNGPToken(function(token){
    if(!token){showErr('Kunde inte hämta token för detaljplanlager.');return;}
    var wmsBase=DP_WMS_URL+'?access_token='+encodeURIComponent(token);
    dpLayer=L.tileLayer.wms(wmsBase,{
      layers:'detaljplan',
      format:'image/png',
      transparent:true,
      version:'1.1.1',
      opacity:0.6,
      tileSize:512,
      updateWhenIdle:true,
      minZoom:1,
      maxZoom:22,
      attribution:'© Lantmäteriet'
    }).addTo(map);
    wmsOn=true;
    if(btn){btn.style.background='#c8f135';btn.style.color='#0e0f11';}
    map.on('click',onMapClickWMS);
  });
}

function onMapClickWMS(e){
  if(!wmsOn){
    console.log('[WMS] Click ignored - layer not enabled');
    return;
  }
  console.log('[WMS] Click at:', e.latlng);
  var lat=e.latlng.lat,lon=e.latlng.lng;
  var sz=map.getSize(),b=map.getBounds();
  var pt=map.latLngToContainerPoint(e.latlng);

  function lngToMX(lg){return lg*20037508.34/180;}
  function latToMY(lt){return Math.log(Math.tan((90+lt)*Math.PI/360))/(Math.PI/180)*20037508.34/180;}
  var bbox3857=lngToMX(b.getWest())+','+latToMY(b.getSouth())+','+lngToMX(b.getEast())+','+latToMY(b.getNorth());

  getNGPToken(function(token){
    if(!token)return;
    var url=DP_WMS_URL
      +'?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo'
      +'&QUERY_LAYERS=detaljplan&LAYERS=detaljplan'
      +'&INFO_FORMAT=application/json&FEATURE_COUNT=3'
      +'&X='+Math.round(pt.x)+'&Y='+Math.round(pt.y)
      +'&BBOX='+bbox3857+'&WIDTH='+sz.x+'&HEIGHT='+sz.y
      +'&SRS=EPSG:3857';

    console.log('[WMS] GetFeatureInfo URL:', url.substring(0,200));

    fetch(url,{headers:{'Accept':'application/json','Authorization':'Bearer '+token}})
    .then(function(r){
      console.log('[WMS] Response status:', r.status);
      return r.ok?r.json():null;
    })
    .then(function(gfiData){
      console.log('[WMS] GFI response:', gfiData);

      if(!gfiData||!gfiData.features||!gfiData.features.length){
        L.popup({maxWidth:260}).setLatLng(e.latlng).setContent(
          '<div style="font-size:12px;padding:8px;color:#9ca3af;">Ingen detaljplan på denna plats</div>'
        ).openOn(map);
        return;
      }

      var props=gfiData.features[0].properties||{};
      console.log('[WMS] Plan properties:', props);
      var namn=props.plannamn||props.plannr||props.namn||props.beteckning
        ||props.PLANNAMN||props.PLANNR||props.BETECKNING||'Okänd plan';
      var bet=props.beteckning||props.planidentitet||props.BETECKNING||'';
      var status=props.status||props.STATUS||props.planstatus||'';

      var html='<div style="font-size:12px;min-width:180px;padding:4px;">'
        +'<b style="color:#c8f135;font-size:13px;">'+namn+'</b><br>'
        +(bet?'<span style="color:#9ca3af;">Beteckning: </span>'+bet+'<br>':'')
        +(status?'<span style="color:#9ca3af;">Status: </span>'+status+'<br>':'')
        +'<span style="color:#9ca3af;font-size:11px;">Söker dokument...</span></div>';
      var popup=L.popup({maxWidth:320}).setLatLng(e.latlng).setContent(html).openOn(map);

      // Detect kommun from coordinates before searching NGP
      detectKommunFromCoordinates(lat, lon, function(detectedKommun) {
        console.log('[WMS] Using kommun:', detectedKommun);
        
        searchNGP(lat,lon,detectedKommun,function(result){
          console.log('[WMS] NGP result:', result);
          var docHtml='';
          if(result&&result.docs&&result.docs.length){
            var docsJson=JSON.stringify(result.docs);
            var encodedDocs=encodeURIComponent(docsJson);
            var planNamn=(result.planNamn||'Detaljplan').replace(/'/g,"&#39;");
            docHtml='<div style="margin-top:6px;">';
            docHtml+='<button data-docs="'+encodedDocs+'" data-plan="'+planNamn+'" onclick="openPDFEl(this);return false;" style="cursor:pointer;background:#c8f135;color:#0e0f11;border:none;border-radius:4px;padding:4px 8px;font-size:10px;font-weight:600;margin-top:4px;">📄 Visa '+result.docs.length+' dokument</button>';
            docHtml+='</div>';
          }
          var minHtml=result&&result.minSize
            ?'<div style="margin-top:4px;font-size:11px;color:#9ca3af;">Min tomt: <b style="color:#c8f135;">'+result.minSize+' m²</b></div>'
            +'<div style="font-size:10px;color:#6b7280;margin-top:2px;">Kommun: '+detectedKommun+'</div>':
            '';
          popup.setContent(
            '<div style="font-size:12px;min-width:180px;padding:4px;">'
            +'<b style="color:#c8f135;font-size:13px;">'+namn+'</b><br>'
            +(bet?'<span style="color:#9ca3af;">Beteckning: </span>'+bet+'<br>':'')
            +(status?'<span style="color:#9ca3af;">Status: </span>'+status+'<br>':'')
            +docHtml+minHtml
            +'</div>'
          );
        });
      });
    })
    .catch(function(err){console.log('[WMS] GFI error:',err);});
  });
}
</script>
</body>
</html>
